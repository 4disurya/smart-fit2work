<body>

  <script>
    const { createApp, ref, reactive, computed, onMounted, onUnmounted, watch } = Vue;

    /* ========== MOCK SYSTEM ========== */
    const USE_MOCK = false;
    window.GAS_ENDPOINT = window.GAS_ENDPOINT || 'https://script.google.com/macros/s/AKfycbxAyBHs6gOI04ZZq38YdDbYn6J1VxD2yIXVr9byxn08695zdr54UubioPyXrob1FCHP/exec';
    window.GAS_API_KEY = window.GAS_API_KEY || 'DEV_KEY';

    const MOCK = {

        { id: 'K-1006', cardUid: null, name: 'Lestari Putri', unit: 'HRD', grup: 'A', dob: '2000-01-01', heightCm: 162, age: 26 },

        { id: 'TRX-20260924-001', timestamp: '2026-09-24T06:12:00', employeeId: 'K-1001', employeeName: 'Budi Santoso', systolic: 128, diastolic: 82, temperature: 36.6, spo2: 98, heartRate: 74, weightKg: 74, heightCm: 172, bmi: 25.0, status: 'FIT', source: 'Bluetooth', reason: '' },
        { id: 'TRX-20260924-002', timestamp: '2026-09-24T06:18:00', employeeId: 'K-1002', employeeName: 'Siti Rahma', systolic: 118, diastolic: 76, temperature: 36.4, spo2: 99, heartRate: 68, weightKg: 54, heightCm: 160, bmi: 21.1, status: 'FIT', source: 'Bluetooth', reason: '' },
        { id: 'TRX-20260924-003', timestamp: '2026-09-24T06:25:00', employeeId: 'K-1005', employeeName: 'Rudi Hartono', systolic: 148, diastolic: 94, temperature: 37.1, spo2: 96, heartRate: 82, weightKg: 88, heightCm: 175, bmi: 28.7, status: 'UNFIT', source: 'Manual', reason: 'Baterai tensimeter habis' },

        { id: 'TRX-20260924-006', timestamp: '2026-09-24T06:48:00', employeeId: 'K-1006', employeeName: 'Lestari Putri', systolic: 110, diastolic: 70, temperature: 36.5, spo2: 99, heartRate: 66, weightKg: 50, heightCm: 162, bmi: 19.1, status: 'FIT', source: 'Bluetooth', reason: '' },
        { id: 'TRX-20260924-007', timestamp: '2026-09-24T06:55:00', employeeId: 'K-1007', employeeName: 'Hendra Gunawan', systolic: 136, diastolic: 88, temperature: 36.9, spo2: 97, heartRate: 78, weightKg: 76, heightCm: 170, bmi: 26.3, status: 'FIT', source: 'Bluetooth', reason: '' },
        { id: 'TRX-20260924-008', timestamp: '2026-09-24T07:02:00', employeeId: 'K-1008', employeeName: 'Maya Sari', systolic: 124, diastolic: 80, temperature: 36.7, spo2: 98, heartRate: 70, weightKg: 52, heightCm: 155, bmi: 21.7, status: 'FIT', source: 'Bluetooth', reason: '' },
        { id: 'TRX-20260923-010', timestamp: '2026-09-23T06:15:00', employeeId: 'K-1001', employeeName: 'Budi Santoso', systolic: 130, diastolic: 84, temperature: 36.5, spo2: 98, heartRate: 72, weightKg: 74, heightCm: 172, bmi: 25.0, status: 'FIT', source: 'Bluetooth', reason: '' },
        { id: 'TRX-20260923-011', timestamp: '2026-09-23T06:22:00', employeeId: 'K-1005', employeeName: 'Rudi Hartono', systolic: 145, diastolic: 92, temperature: 36.9, spo2: 95, heartRate: 80, weightKg: 88, heightCm: 175, bmi: 28.7, status: 'UNFIT', source: 'Bluetooth', reason: '' },
        { id: 'TRX-20260923-012', timestamp: '2026-09-23T06:30:00', employeeId: 'K-1002', employeeName: 'Siti Rahma', systolic: 116, diastolic: 74, temperature: 36.3, spo2: 99, heartRate: 65, weightKg: 54, heightCm: 160, bmi: 21.1, status: 'FIT', source: 'Bluetooth', reason: '' },
      ],
      weekly: [
        { label: 'Sen', fit: 42, unfit: 5 },
        { label: 'Sel', fit: 45, unfit: 3 },
        { label: 'Rab', fit: 40, unfit: 7 },
        { label: 'Kam', fit: 44, unfit: 4 },
        { label: 'Jum', fit: 46, unfit: 2 },
        { label: 'Sab', fit: 30, unfit: 2 },
        { label: 'Min', fit: 12, unfit: 1 },
      ],
    };

    /* ========== API HELPER (GAS) ========== */
    async function apiPost(action, data) {
      if (USE_MOCK) {
        await new Promise((r) => setTimeout(r, 350));
        if (action === 'login') {
          if (data.pin === MOCK.pin) return { ok: true, user: MOCK.user };
          return { ok: false, message: 'PIN salah' };
        }
        if (action === 'saveRecord') {
          const key = String(data.employeeId || '') + '|' + String(data.timestamp || '');
          MOCK._savedKeys = MOCK._savedKeys || {};
          if (MOCK._savedKeys[key]) {
            return Object.assign({ ok: true, duplicate: true }, MOCK._savedKeys[key]);
          }
          const id = 'TRX-' + Date.now();
          MOCK._savedKeys[key] = { id: id, status: calcStatus(Number(data.systolic), Number(data.temperature)) };
          return { ok: true, id: id, status: MOCK._savedKeys[key].status };
        }
        if (action === 'listRecords') {
          return { ok: true, records: MOCK.records.slice(0, 50) };
        }
        if (action === 'listEmployees') {
          return { ok: true, employees: MOCK.employees };
        }
        if (action === 'addEmployee') {
          let maxNum = 1000;
          MOCK.employees.forEach((e) => {
            const m = /^K-(\d+)$/.exec(e.id);
            if (m && Number(m[1]) > maxNum) maxNum = Number(m[1]);
          });
          const now = new Date();
          const p = String(data.dob || '').split('-').map(Number);
          let age = now.getFullYear() - p[0];
          if (now.getMonth() + 1 < p[1] || (now.getMonth() + 1 === p[1] && now.getDate() < p[2])) age--;
          const grup = String(data.grup || '').trim().toUpperCase();
          if (!/^[A-D]$/.test(grup)) return { ok: false, message: 'Grup tugas wajib dipilih (A, B, C, atau D)' };
          const emp = {
            id: 'K-' + String(maxNum + 1).padStart(4, '0'),
            cardUid: null,
            name: String(data.name || '').trim(),
            unit: String(data.unit || '').trim(),
            grup: grup,
            dob: data.dob,
            heightCm: Number(data.heightCm),
            age: age,
          };
          MOCK.employees.push(emp);
          return { ok: true, employee: emp };
        }
        if (action === 'stats') {
          const records = MOCK.records.filter((r) => r.timestamp.startsWith('2026-09-24'));
          return {
            ok: true,
            totalToday: records.length,
            fitToday: records.filter((r) => r.status === 'FIT').length,
            unfitToday: records.filter((r) => r.status === 'UNFIT').length,
            avgMinutes: 82,
            weekly: MOCK.weekly,
          };
        }
        if (action === 'listDutyOfficers') {
          const overrides = MOCK._dutyOverrides || {};
          const officers = MOCK.dutyOfficers.map((o) => {
            const ov = overrides[o.id] || {};
            return Object.assign({}, o, { name: ov.name || o.name, role: ov.role || o.role });
          });
          return { ok: true, officers: officers };
        }
        if (action === 'saveDutyOfficer') {
          MOCK._dutyOverrides = MOCK._dutyOverrides || {};
          let newName = String(data.name || '').trim();
          let newRole = String(data.role || '').trim();
          const orig = MOCK.dutyOfficers.find((x) => x.id === data.id);
          if (!orig) return { ok: false, message: 'Petugas tidak ditemukan' };
          if (!newName) newName = orig.name;
          if (!newRole) newRole = orig.role;
          MOCK._dutyOverrides[data.id] = { name: newName, role: newRole };
          return { ok: true, officer: Object.assign({}, orig, { name: newName, role: newRole }) };
        }
        if (action === 'saveEmployeeCard') {
          const employeeId = String(data.employeeId || '').trim();
          let cardUid = String(data.cardUid || '');
          if (!employeeId) return { ok: false, message: 'ID karyawan wajib diisi' };
          if (cardUid !== '') {
            cardUid = cardUid.replace(/[-:\s]/g, '').toUpperCase();
            if (!/^[A-Z0-9]{4,32}$/.test(cardUid)) return { ok: false, message: 'Format UID tidak valid (4-32 karakter huruf/angka)' };
          }
          const empIdx = MOCK.employees.findIndex((e) => e.id === employeeId);
          if (empIdx === -1) return { ok: false, message: 'Karyawan tidak ditemukan' };
          if (cardUid !== '') {
            const dup = MOCK.employees.find((e) => e.id !== employeeId && String(e.cardUid || '').toUpperCase() === cardUid);
            if (dup) return { ok: false, message: 'Kartu sudah terdaftar untuk ' + dup.name + ' (' + dup.id + ')' };
          }
          MOCK.employees[empIdx].cardUid = cardUid === '' ? null : cardUid;
          return { ok: true, employee: MOCK.employees[empIdx] };
        }
        return { ok: true };
      }

      const endpoint = window.GAS_ENDPOINT || '';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, data, apiKey: window.GAS_API_KEY || '' }),
        });
        return await res.json();
      } catch (e) {
        return { ok: false, message: 'Koneksi ke server gagal — periksa internet lalu coba lagi.' };
      }
    }

    function readDuty() {
      try {
        const id = sessionStorage.getItem('sf2w_duty');
        if (!id) return null;
        const o = MOCK.dutyOfficers.find((x) => x.id === id);
        if (!o) return null;
        let overrides = {};
        try {
          overrides = JSON.parse(sessionStorage.getItem('sf2w_duty_overrides') || '{}') || {};
        } catch(e) {
          try {
            const names = JSON.parse(sessionStorage.getItem('sf2w_duty_names') || '{}') || {};
            if (names[o.id]) overrides[o.id] = { name: names[o.id] };
          } catch(ee) {}
        }
        const ov = overrides[o.id];
        return ov ? Object.assign({}, o, { name: ov.name || o.name, role: ov.role || o.role }) : o;
      } catch (e) {
        return null;
      }
    }

    /* ========== DOMAIN HELPERS ========== */
    function calcBmi(weightKg, heightCm) {
      if (!weightKg || !heightCm) return null;
      const m = heightCm / 100;
      return Math.round((weightKg / (m * m)) * 10) / 10;
    }

    function calcStatus(systolic, temperature) {
      if (systolic == null || temperature == null) return null;
      return systolic < 140 && temperature < 37.5 ? 'FIT' : 'UNFIT';
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '-';
      return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '-';
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function toCSV(rows) {
      if (!rows.length) return '';
      const headers = ['ID', 'Timestamp', 'ID Karyawan', 'Nama', 'Sistolik', 'Diastolik', 'Suhu', 'SPO2', 'HR', 'Berat', 'Tinggi', 'BMI', 'Status', 'Sumber', 'Alasan'];
      const lines = [headers.join(',')];
      rows.forEach((r) => {
        lines.push([
          r.id, r.timestamp, r.employeeId, `"${r.employeeName}"`,
          r.systolic, r.diastolic, r.temperature, r.spo2, r.heartRate,
          r.weightKg, r.heightCm, r.bmi, r.status, r.source, `"${r.reason || ''}"`,
        ].join(','));
      });
      return lines.join('\n');
    }

    /* ========== BLUETOOTH SKELETON ========== */
    const DEVICE_PROFILES = {
      tensi: { name: 'Tensi Meter', service: 0x1810, chars: [0x2A35] },
      thermo: { name: 'Termometer', service: 0x1809, chars: [0x2A1C, 0x2A1E] },
      spo2: { name: 'SPO2', service: 0x1822, chars: [0x2A5E, 0x2A5F] },
      scale: { name: 'Timbangan', service: 0x181D, chars: [0x2A9D], feature: 0x2A9E },
    };

    const BT_MEASURE_TIMEOUT = 120000;
    const BT_POLL_INTERVAL = 2000;
    const BT_READ_TIMEOUT = 4000;
    const BT_SPO2_STABLE_READS = 2;
    const BT_FRAME_MAX_AGE = 90000;
    const BT_OLD_RECORD_MS = 30 * 60 * 1000;
    const WSS_RES_KG = [0.5, 0.2, 0.1, 0.05, 0.02, 0.01, 0.005];
    const WSS_RES_LB = [1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01];

    const BT = {};
    const BTPaired = {};
    const btReconn = {};
    let btCancelled = false;
    let btLog = [];

    function loadBtLog() {
      try {
        if (typeof sessionStorage !== 'undefined') {
          const data = JSON.parse(sessionStorage.getItem('sf2w_bt_log') || '[]');
          if (Array.isArray(data)) {
            return data.map((e) => ({
              t: e.t, who: e.who || e.device || '-',
              act: e.act || e.event || '-', msg: e.msg || e.detail || '',
            }));
          }
        }
      } catch (e) {}
      return [];
    }

    function saveBtLog() {
      try {
        if (typeof sessionStorage !== 'undefined') {
          sessionStorage.setItem('sf2w_bt_log', JSON.stringify(btLog.slice(0, 30)));
        }
      } catch (e) {}
    }

    function btLogPush(device, event, detail) {
      btLog.unshift({ t: new Date().toISOString(), who: device || '-', act: event || '-', msg: detail || '' });
      if (btLog.length > 60) btLog.length = 60;
      saveBtLog();
      try { window.dispatchEvent(new CustomEvent('sf2w:bt-log', { detail: btLog.slice() })); } catch (e) {}
    }

    function getBtLog() {
      if (!btLog.length) btLog = loadBtLog();
      return btLog.slice();
    }

    function hexDump(dv, max) {
      if (!dv || !dv.byteLength) return '-';
      const n = Math.min(dv.byteLength, max || 32);
      const out = [];
      for (let i = 0; i < n; i++) out.push(dv.getUint8(i).toString(16).padStart(2, '0'));
      return out.join(' ') + (dv.byteLength > n ? ' …' : '');
    }

    function propsText(props) {
      if (!props) return '-';
      return ['read', 'notify', 'indicate', 'write', 'writeWithoutResponse']
        .filter((p) => props[p]).join(',') || '-';
    }

    function btClearMeasure() {
      btCancelled = true;
    }

    function btDetach(key) {
      const h = BT[key];
      if (!h) return;
      h.onFrame = null;
      if (h.characteristic && h.listener) {
        try { h.characteristic.removeEventListener('characteristicvaluechanged', h.listener); } catch (e) {}
        h.listener = null;
        try { h.characteristic.stopNotifications(); } catch (e) {}
      }
    }

    function btDisconnect(key) {
      btStopReconnect(key);
      const h = BT[key];
      if (!h) return;
      btDetach(key);
      delete BT[key];
      if (h.device && h.device.gatt && h.device.gatt.connected) {
        try { h.device.gatt.disconnect(); } catch (e) {}
      }
    }

    function btUnpair(key) {
      btStopReconnect(key);
      delete BTPaired[key];
      try {
        if (typeof sessionStorage !== 'undefined') sessionStorage.removeItem('sf2w_pair_' + key);
      } catch (e) {}
    }

    async function btRestorePair(key) {
      try {
        if (typeof sessionStorage === 'undefined') return null;
        if (!navigator.bluetooth || typeof navigator.bluetooth.getDevices !== 'function') return null;
        const id = sessionStorage.getItem('sf2w_pair_' + key);
        if (!id) return null;
        const list = await navigator.bluetooth.getDevices();
        const dev = (list || []).find((d) => d && d.id === id);
        if (dev) {
          BTPaired[key] = dev;
          btLogPush(DEVICE_PROFILES[key].name, 'pasangan', 'perangkat terpasang terdeteksi: ' + (dev.name || id));
          return dev;
        }
      } catch (e) {}
      return null;
    }

    function btStopReconnect(key) {
      const st = btReconn[key];
      if (!st) return;
      if (st.timer) clearTimeout(st.timer);
      delete btReconn[key];
    }

    function btStartReconnect(key) {
      if (btReconn[key] || !BTPaired[key]) return;
      const profile = DEVICE_PROFILES[key];
      const st = { n: 0 };
      btReconn[key] = st;
      btLogPush(profile.name, 'reconnect', 'auto-reconnect aktif — menunggu perangkat aktif tanpa tombol Connect.');
      const tick = async () => {
        st.timer = null;
        if (btReconn[key] !== st) return;
        if (BT[key] && BT[key].characteristic && !BT[key].simulated) { delete btReconn[key]; return; }
        if (!BTPaired[key]) { delete btReconn[key]; return; }
        st.n++;
        try {
          const res = await bluetoothConnect(key, { silent: true });
          if (res.ok && !res.simulated) {
            delete btReconn[key];
            btLogPush(profile.name, 'reconnect', 'TERHUBUNG otomatis: ' + res.device);
            window.dispatchEvent(new CustomEvent('sf2w:bt-connected', { detail: { key: key, name: res.device } }));
            return;
          }
          if (res.fatal) {
            delete btReconn[key];
            btLogPush(profile.name, 'reconnect', 'gagal permanen: ' + res.message);
            window.dispatchEvent(new CustomEvent('sf2w:bt-reconn-failed', { detail: { key: key, message: res.message } }));
            return;
          }
          if (st.n === 1 || st.n % 5 === 0) {
            btLogPush(profile.name, 'reconnect', 'coba #' + st.n + ' — perangkat belum aktif (' + res.message + ')');
          }
        } catch (e) {
          if (st.n === 1 || st.n % 5 === 0) {
            btLogPush(profile.name, 'reconnect', 'coba #' + st.n + ' gagal: ' + ((e && e.message) || '-'));
          }
        }
        // Retry cepat (1,5 dtk): jendela hasil timbangan hanya ±3 dtk setelah bangun/auto-off —
        // interval 4 dtk melewatkannya. Log sudah di-throttle (awal + tiap ke-5), jadi tidak membanjiri.
        if (btReconn[key] === st) st.timer = setTimeout(tick, 1500);
      };
      tick();
    }

    async function bluetoothConnect(key, opts) {
      const profile = DEVICE_PROFILES[key];
      if (!navigator.bluetooth) {
        btLogPush(profile.name, 'koneksi', 'Web Bluetooth tidak tersedia → mode SIMULASI.');
        return {
          ok: true,
          simulated: true,
          device: profile.name + ' (Simulasi)',
          message: 'Web Bluetooth tidak tersedia — koneksi simulasi aktif.',
        };
      }
      let device = BTPaired[key] || null;
      const fromPair = !!device;
      const extraServices = [
        0x1808, 0x1809, 0x180A, 0x180D, 0x180F, 0x1810, 0x181D, 0x1822,
        0xFFE0, 0xFF00, 0xFFF0, 0xFE00,
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
      ];
      if (fromPair) {
        btLogPush(profile.name, 'koneksi', 'pakai pasangan tersimpan (tanpa chooser): ' + (device.name || device.id || '-'));
      } else {
        try {
          device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [profile.service].concat(extraServices.filter((u) => u !== profile.service)),
          });
        } catch (err) {
          if (err && err.name === 'NotFoundError') {
            btLogPush(profile.name, 'koneksi', 'Pemilihan perangkat dibatalkan.');
            return { ok: false, cancelled: true, message: 'Pemilihan dibatalkan' };
          }
          btLogPush(profile.name, 'koneksi', 'GAGAL: ' + ((err && err.message) || 'unknown'));
          return { ok: false, message: (err && err.message) || 'Gagal terhubung' };
        }
        BTPaired[key] = device;
        try {
          if (device.id && typeof sessionStorage !== 'undefined') sessionStorage.setItem('sf2w_pair_' + key, device.id);
        } catch (e) {}
      }

      const newHandle = (extra) => Object.assign({
        device: device, characteristic: null, simulated: false,
        deviceName: device.name || profile.name,
        serviceUuid: '-', charUuid: '-', props: '-',
        wssIdx: 2, buffer: [], listener: null, onFrame: null,
      }, extra || {});

      const shortUuid = (u) => String(u).toLowerCase().replace(/-0000-1000-8000-00805f9b34fb$/, '');
      const fmtUuid = (u) => {
        if (typeof u === 'number') return '0x' + u.toString(16).toUpperCase();
        const s = String(u);
        if (/^[0-9a-f]{4}$/i.test(s)) return '0x' + s.toUpperCase();
        if (/^0{4}[0-9a-f]{4}$/i.test(s)) return '0x' + s.slice(4).toUpperCase();
        return s;
      };

      async function discoverServices() {
        try {
          const list = await device.gatt.getPrimaryServices();
          return list.map((s) => ({ uuid: String(s.uuid), service: s }));
        } catch (e) {
          return null;
        }
      }

      const isSigUuid = (u) => {
        let hex = String(u);
        if (/^[0-9a-f]{8}$/.test(hex)) {
          if (hex.slice(0, 4) !== '0000') return false;
          hex = hex.slice(4);
        }
        if (!/^[0-9a-f]{4}$/.test(hex)) return false;
        const v = parseInt(hex, 16);
        return (v >= 0x1800 && v <= 0x18ff) || (v >= 0x2a00 && v <= 0x2aff);
      };

      async function sniffChar(services) {
        if (!services) return null;
        const cands = [];
        for (const s of services) {
          try {
            const chars = await s.service.getCharacteristics();
            for (const c of chars) {
              const p = c.properties || {};
              if (!(p.notify || p.indicate)) continue;
              const u = shortUuid(c.uuid);
              if (isSigUuid(u)) continue;
              cands.push({
                service: s.service, serviceUuid: shortUuid(s.uuid), char: c, uuid: u,
                score: (p.notify ? 2 : 0) + (p.indicate ? 1 : 0) - (p.write || p.writeWithoutResponse ? 1 : 0),
              });
            }
          } catch (e) {}
        }
        if (!cands.length) return null;
        cands.sort((a, b) => b.score - a.score);
        cands[0].alt = cands.slice(1).map((x) => x.uuid);
        return cands[0];
      }

      async function inventoryText(services) {
        if (!services) return 'discovery dibat browser';
        if (!services.length) return '(tidak ada service yang boleh diakses Chrome)';
        const out = [];
        for (const s of services) {
          try {
            const chars = await s.service.getCharacteristics();
            out.push(shortUuid(s.uuid) + '[' + chars.map((c) => shortUuid(c.uuid) + ':' + propsText(c.properties)).join(' ') + ']');
          } catch (e) {
            out.push(shortUuid(s.uuid) + '[akses ditolak]');
          }
        }
        return out.join(' ') || '(kosong)';
      }

      try {
        const server = await device.gatt.connect();
        const found = { service: null, characteristic: null, charUuid: null, serviceUuid: null, missing: [] };

        async function tryService(svc, svcUuid) {
          for (const uuid of profile.chars) {
            try {
              const c = await svc.getCharacteristic(uuid);
              found.service = svc;
              found.characteristic = c;
              found.charUuid = uuid;
              found.serviceUuid = svcUuid;
              return true;
            } catch (e) {
              found.missing.push('0x' + uuid.toString(16).toUpperCase());
            }
          }
          return false;
        }

        let primary = null;
        try { primary = await server.getPrimaryService(profile.service); } catch (e) {}
        let okFound = false;
        if (primary) okFound = await tryService(primary, '0x' + profile.service.toString(16).toUpperCase());

        let services = null;
        if (!okFound) {
          services = await discoverServices();
          if (services) {
            for (const s of services) {
              if (await tryService(s.service, shortUuid(s.uuid))) { okFound = true; break; }
            }
          }
        }

        if (!okFound) {
          const list = services ? services.map((s) => shortUuid(s.uuid)).join(' ') : 'discovery dibat browser';
          const tried = Array.from(new Set(found.missing)).join(', ');
          if (key === 'thermo' && services && services.some((s) => shortUuid(s.uuid) === '00001810')) {
            throw new Error('Alat ini monitor tekanan darah (Blood Pressure), bukan termometer — pilih perangkat termometer. Services: ' + list);
          }
          const sniff = await sniffChar(services);
          if (sniff) {
            found.service = sniff.service;
            found.characteristic = sniff.char;
            found.charUuid = sniff.uuid;
            found.serviceUuid = sniff.serviceUuid;
            okFound = true;
            btLogPush(device.name || profile.name, 'koneksi',
              'char profil tidak ada → sniff kustom ' + sniff.uuid + ' @ ' + sniff.serviceUuid +
              (sniff.alt && sniff.alt.length ? ' (kandidat lain: ' + sniff.alt.join(' ') + ')' : ''));
          } else {
            const inv = await inventoryText(services);
            throw new Error('Karakteristik tidak ditemukan di service mana pun (dicoba: ' + tried +
              ') — Services: ' + (list || '(kosong — hanya service di optionalServices yang boleh dilihat Chrome)') +
              ' — Inventory: ' + inv);
          }
        }

        const handle = newHandle({
          characteristic: found.characteristic,
          serviceUuid: found.serviceUuid,
          charUuid: fmtUuid(found.charUuid),
          props: propsText(found.characteristic.properties),
        });
        BT[key] = handle;

        if (profile.feature) {
          try {
            const f = await found.service.getCharacteristic(profile.feature);
            const feature = (await f.readValue()).getUint16(0, true);
            const idx = (feature & 0x38) >> 3;
            handle.wssIdx = idx > 0 ? idx - 1 : 2;
          } catch (e) {
            handle.wssIdx = 2;
          }
        }

        if (!services) services = await discoverServices();
        const svcList = services ? services.map((s) => shortUuid(s.uuid)).join(' ') : 'discovery dibat browser';

        if (!device._sf2wDisc) {
          device._sf2wDisc = () => {
            const h = BT[key];
            if (h && !h.simulated) {
              delete BT[key];
              window.dispatchEvent(new CustomEvent('sf2w:bt-disconnected', { detail: { key: key, label: profile.name } }));
            }
            if (key === 'scale' && BTPaired[key]) btStartReconnect(key);
          };
          device.addEventListener('gattserverdisconnected', device._sf2wDisc);
        }

        btLogPush(handle.deviceName, 'koneksi',
          'GATT OK · service ' + handle.serviceUuid + ' · char ' + handle.charUuid +
          ' · props ' + handle.props + ' · services: ' + svcList);

        btAttach(key);
        return { ok: true, simulated: false, device: handle.deviceName };
      } catch (err) {
        const msg = (err && err.message) || 'GATT/karakteristik tidak tersedia';
        if (opts && opts.silent) {
          const gattUp = !!(device && device.gatt && device.gatt.connected);
          if (gattUp) { try { device.gatt.disconnect(); } catch (e) {} }
          btLogPush(device && device.name ? device.name : profile.name, 'reconnect',
            'belum bisa: ' + msg + (gattUp ? ' (GATT naik tetapi karakteristik gagal)' : ''));
          return { ok: false, silent: true, fatal: gattUp, message: msg };
        }
        if (fromPair) {
          const gattUp = !!(device && device.gatt && device.gatt.connected);
          if (gattUp) {
            try { device.gatt.disconnect(); } catch (e) {}
            btUnpair(key);
            btLogPush(device && device.name ? device.name : profile.name, 'koneksi',
              'pasangan tidak cocok → dihapus, pilih ulang perangkat: ' + msg);
            return { ok: false, rechoose: true, message: 'Perangkat terpasang tidak cocok (' + msg + ') — klik Connect dan pilih ulang perangkat.' };
          }
          btStartReconnect(key);
          return { ok: false, reconnecting: true, message: 'Perangkat belum aktif — nyalakan alat, atau tunggu auto-reconnect.' };
        }
        const handle = newHandle({ simulated: true });
        BT[key] = handle;
        btLogPush(handle.deviceName, 'koneksi', 'GAGAL → SIMULASI · ' + msg);
        return { ok: true, simulated: true, device: handle.deviceName + ' (Simulasi)', message: msg };
      }
    }

    /* --- Parser GATT per perangkat (spesifikasi Bluetooth SIG) --- */
    function readSFloat(dv, o) {
      const raw = dv.getUint16(o, true);
      let mant = raw & 0x0FFF;
      if (mant & 0x0800) mant -= 0x1000;
      let exp = (raw >> 12) & 0x0F;
      if (exp & 0x08) exp -= 0x10;
      return mant * Math.pow(10, exp);
    }

    function parseDateTime(dv, o) {
      const year = dv.getUint16(o, true);
      const month = dv.getUint8(o + 2);
      const day = dv.getUint8(o + 3);
      if (!year || year < 2000 || !month || month > 12 || !day || day > 31) return null;
      return new Date(year, month - 1, day, dv.getUint8(o + 4), dv.getUint8(o + 5), dv.getUint8(o + 6));
    }

    function plausible(key, v) {
      if (!v) return false;
      if (key === 'tensi') {
        return v.systolic >= 60 && v.systolic <= 260 &&
          v.diastolic >= 30 && v.diastolic <= 160 &&
          v.diastolic < v.systolic;
      }
      if (key === 'thermo') return v.temperature >= 20 && v.temperature <= 50;
      if (key === 'spo2') return v.spo2 >= 50 && v.spo2 <= 100;
      if (key === 'scale') return v.weightKg >= 20 && v.weightKg <= 300;
      return true;
    }

    function parseBloodPressure(dv) {
      const flags = dv.getUint8(0);
      let off = 1;
      let sys, dia;
      if (flags & 0x01) {
        sys = readSFloat(dv, off); off += 2;
        dia = readSFloat(dv, off); off += 2;
        off += 2;
        const toMmHg = (v) => {
          let kpa = v;
          if (kpa > 60) kpa = kpa / 10;
          return Math.round(kpa * 7.50062);
        };
        sys = toMmHg(sys);
        dia = toMmHg(dia);
      } else {
        sys = Math.round(readSFloat(dv, off)); off += 2;
        dia = Math.round(readSFloat(dv, off)); off += 2;
        off += 2;
      }
      let recordedAt = null;
      if (flags & 0x02) { recordedAt = parseDateTime(dv, off); off += 7; }
      let hr = null;
      if (flags & 0x04) { hr = Math.round(readSFloat(dv, off)); off += 2; }
      if (flags & 0x08) off += 1;
      if (flags & 0x10) off += 2;
      if (!(hr >= 20 && hr <= 220)) hr = null;
      return { systolic: sys, diastolic: dia, heartRate: hr, recordedAt: recordedAt, flags: flags };
    }

    function parseTemperature(dv) {
      const flags = dv.getUint8(0);
      const round1 = (v) => Math.round(v * 10) / 10;
      const cands = [];
      const fRaw = dv.byteLength >= 5 ? dv.getFloat32(1, true) : NaN;
      if (flags & 0x01) cands.push({ f: 'F→C', v: (fRaw - 32) * 5 / 9 });
      cands.push({ f: 'float32', v: fRaw });
      if (dv.byteLength >= 3) {
        cands.push({ f: 'sfloat', v: readSFloat(dv, 1) });
        const i16 = dv.getInt16(1, true);
        cands.push({ f: 'i16/10', v: i16 / 10 });
        cands.push({ f: 'i16/100', v: i16 / 100 });
      }
      let chosen = null;
      for (let i = 0; i < cands.length; i++) {
        if (Number.isFinite(cands[i].v) && cands[i].v >= 20 && cands[i].v <= 50) { chosen = cands[i]; break; }
      }
      if (!chosen) chosen = { f: 'float32', v: fRaw };
      let recordedAt = null;
      if (flags & 0x02) recordedAt = parseDateTime(dv, 5);
      const out = { temperature: round1(chosen.v), format: chosen.f, recordedAt: recordedAt, flags: flags };
      if (chosen.f !== 'float32') {
        out.cands = cands.map((c) => c.f + '=' + (Number.isFinite(c.v) ? round1(c.v) : '-')).join(' ');
      }
      return out;
    }

    function parsePulseOx(dv) {
      const flags = dv.getUint8(0);
      const alt = [];
      let spo2 = null;
      if (dv.byteLength >= 3) {
        const sf = Math.round(readSFloat(dv, 1));
        if (sf >= 50 && sf <= 100) spo2 = sf; else alt.push('sfloat=' + sf);
      } else if (dv.byteLength === 2) {
        const b = dv.getUint8(1);
        if (b >= 50 && b <= 100) spo2 = b;
        alt.push('u8@1=' + b);
      }
      let heartRate = null;
      if (dv.byteLength >= 5) {
        try { heartRate = Math.round(readSFloat(dv, 3)); } catch (e) { heartRate = null; }
      }
      if (dv.byteLength >= 4) alt.push('u8@3=' + dv.getUint8(3));
      if (dv.byteLength >= 5) alt.push('u8@4=' + dv.getUint8(4));
      const cand = [];
      if (spo2 === null && dv.byteLength >= 3) {
        const b1 = dv.getUint8(1);
        if (b1 >= 50 && b1 <= 100) cand.push(b1);
        if (dv.byteLength >= 5) {
          const b4 = dv.getUint8(4);
          if (b4 >= 50 && b4 <= 100 && b4 !== b1) cand.push(b4);
        }
      }
      return { spo2: spo2, heartRate: heartRate, alt: alt.join(' '), flags: flags, cand: cand };
    }

    function parseWeight(dv, h) {
      const flags = dv.getUint8(0);
      // Format IF / MovingLife (mis. Onemed IF20250A — OEM IF_B*): berat = u16 BE @8 ÷10 kg, status @14 (0x02 turun, 0x03 stabil)
      if (dv.byteLength >= 15) {
        const st = dv.getUint8(14);
        if (st === 0x02 || st === 0x03) {
          const kgIF = dv.getUint16(8, false) / 10;
          if (kgIF >= 20 && kgIF <= 300) {
            return { weightKg: Math.round(kgIF * 10) / 10, stable: st === 0x03, format: 'if-be', recordedAt: null, flags: flags };
          }
        }
      }
      // IF_B2A (TERKONFIRMASI capture lapangan 20.25 — Onemed IF20250A): frame notifikasi 14 byte
      // `10 00 00 c5 0e 03 80 <hi> <lo> …` — berat = u16 BE @7 ÷10 kg (settle 70.1→54.8→…→73.4).
      // Signature: len ≥14 + byte0 0x10 (tipe paket) + byte6 0x80 — beacon 20B (byte6 0x82) ditolak; rentang 20–300 gerbang kedua.
      if (dv.byteLength >= 14 && flags === 0x10 && dv.getUint8(6) === 0x80) {
        const kgB2A = dv.getUint16(7, false) / 10;
        if (kgB2A >= 20 && kgB2A <= 300) {
          return { weightKg: Math.round(kgB2A * 10) / 10, format: 'if-b2a', recordedAt: null, flags: flags };
        }
      }
      let off = 1;
      const imperial = !!(flags & 0x01);
      let recordedAt = null;
      if (flags & 0x02) { recordedAt = parseDateTime(dv, off); off += 7; }
      if (flags & 0x04) off += 1;
      const raw = dv.getUint16(off, true);
      const idx = h && typeof h.wssIdx === 'number' ? h.wssIdx : 2;
      const table = imperial ? WSS_RES_LB : WSS_RES_KG;
      const step = table[idx] || table[2];
      let kg = raw * step * (imperial ? 0.453592 : 1);
      if (!(kg >= 20 && kg <= 300)) {
        for (let i = 0; i < table.length; i++) {
          const cand = raw * table[i] * (imperial ? 0.453592 : 1);
          if (cand >= 20 && cand <= 300) { kg = cand; break; }
        }
      }
      const out = { weightKg: Math.round(kg * 10) / 10, recordedAt: recordedAt, flags: flags };
      if (!(kg >= 20 && kg <= 300)) {
        // Discovery: daftar kandidat bobot mentah (offset LE/BE, skala ÷10 lalu ÷1) untuk laporan teknisi.
        // Kandidat HANYA di-log — weightKg tetap di luar rentang → tidak pernah diterima otomatis.
        const cands = [];
        const pushCand = (s) => { if (cands.length < 10) cands.push(s); };
        for (let o = 0; o + 1 < dv.byteLength && cands.length < 10; o++) {
          const le = dv.getUint16(o, true);
          const be = dv.getUint16(o, false);
          if (le >= 200 && le <= 3000) pushCand('@' + o + 'LE/10=' + (le / 10));
          if (be >= 200 && be <= 3000 && be !== le) pushCand('@' + o + 'BE/10=' + (be / 10));
        }
        for (let o = 0; o + 1 < dv.byteLength && cands.length < 10; o++) {
          const le = dv.getUint16(o, true);
          const be = dv.getUint16(o, false);
          if (le >= 20 && le <= 300) pushCand('@' + o + 'LE=' + le);
          if (be >= 20 && be <= 300 && be !== le) pushCand('@' + o + 'BE=' + be);
        }
        if (cands.length) out.cands = cands.join(' ');
      }
      return out;
    }

    const BT_PARSERS = {
      tensi: parseBloodPressure,
      thermo: parseTemperature,
      spo2: parsePulseOx,
      scale: parseWeight,
    };

    function frameIsOld(frame) {
      const d = frame && frame.values && frame.values.recordedAt;
      if (!d) return false;
      if (d.getFullYear && d.getFullYear() < 2020) return false;
      const diff = Date.now() - d.getTime();
      if (isNaN(diff)) return false;
      if (diff < -BT_OLD_RECORD_MS) return false;
      return diff > BT_OLD_RECORD_MS;
    }

    function btParseFrame(key, dv, h, keep) {
      const frame = { t: Date.now(), hex: hexDump(dv, 256), len: dv.byteLength, flags: null, values: null, ok: false, error: '' };
      try {
        frame.flags = dv.getUint8(0);
        frame.values = BT_PARSERS[key](dv, h);
        frame.ok = plausible(key, frame.values);
        if (!frame.ok) frame.error = 'nilai di luar rentang wajar';
      } catch (e) {
        frame.error = (e && e.message) || 'payload tidak bisa dibaca';
      }
      if (h && keep !== false) {
        h.buffer = h.buffer || [];
        h.buffer.push(frame);
        if (h.buffer.length > 20) h.buffer.shift();
      }
      // Path read (keep=false) sudah dirangkum oleh log 'baca' baseline/polling — jangan duplikat baris frame.
      if (keep !== false) {
        const who = h ? h.deviceName : key;
        const msg = 'hex ' + frame.hex + ' · len ' + frame.len + ' · flags ' + (frame.flags === null ? '-' : '0x' + frame.flags.toString(16)) +
          ' → ' + (frame.ok ? JSON.stringify(frame.values)
            : 'GAGAL: ' + frame.error + (frame.values ? ' · ' + JSON.stringify(frame.values) : ''));
        // Stream timbangan memancarkan frame identik sangat cepat — throttle: frame identik beruntun (≤3 dtk)
        // cukup dicatat sekali agar baris koneksi/sniff tidak terusir. Buffer, parser, dan auto-apply TETAP jalan tiap frame.
        const prev = btLog[0];
        const dup = !!prev && prev.act === 'frame' && prev.who === who && prev.msg === msg &&
          Date.now() - Date.parse(prev.t) < 3000;
        if (!dup) btLogPush(who, 'frame', msg);
      }
      return frame;
    }

    async function btAttach(key) {
      const h = BT[key];
      if (!h || h.simulated || !h.characteristic) return false;
      if (h.listener) return true;
      try {
        await h.characteristic.startNotifications();
        h.listener = (ev) => {
          const frame = btParseFrame(key, ev.target.value, h);
          if (h.onFrame) h.onFrame(frame);
          else btAutoApply(key, frame, h);
        };
        h.characteristic.addEventListener('characteristicvaluechanged', h.listener);
        btLogPush(h.deviceName, 'langganan', 'notifikasi aktif (' + h.props + ')');
        return true;
      } catch (e) {
        btLogPush(h.deviceName, 'langganan', 'GAGAL: ' + ((e && e.message) || 'startNotifications'));
        return false;
      }
    }

    function btReadValue(ch, ms) {
      const limit = ms || BT_READ_TIMEOUT;
      return new Promise((resolve, reject) => {
        let settled = false;
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error('readValue > ' + limit + 'ms (timeout)'));
        }, limit);
        Promise.resolve().then(() => ch.readValue()).then((dv) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(dv);
        }, (err) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(err);
        });
      });
    }

    function btStableCand(buf) {
      if (!buf || buf.length < 2) return null;
      const a = buf[buf.length - 2], b = buf[buf.length - 1];
      if (!a || !b || a.ok || b.ok || frameIsOld(a) || frameIsOld(b)) return null;
      if ((Date.now() - a.t) > BT_FRAME_MAX_AGE || (Date.now() - b.t) > BT_FRAME_MAX_AGE) return null;
      const ca = a.values && a.values.cand, cb = b.values && b.values.cand;
      if (!ca || !ca.length || !cb || !cb.length) return null;
      return ca[0] === cb[0] ? ca[0] : null;
    }

    function btPickScale(buf) {
      return buf && buf.length ? buf[buf.length - 1] : null;
    }

    /* Auto-kirim bobot: frame valid pertama (tanpa gerbang konfirmasi) langsung
       di-dispatch ke komponen — timbangan auto-off, data tak boleh tertunda. */
    function btAutoApply(key, frame, h) {
      if (key !== 'scale' || !frame || !frame.ok || frameIsOld(frame)) return;
      if ((Date.now() - frame.t) > BT_FRAME_MAX_AGE) return;
      const v = frame.values;
      if (h.autoSentKg === v.weightKg) return;
      h.autoSentKg = v.weightKg;
      window.dispatchEvent(new CustomEvent('sf2w:bt-auto', { detail: { key: key, values: v } }));
    }

    /* --- Hasil simulasi (fallback saat GATT/notify tak tersedia) --- */
    function rand(min, max) { return Math.round(min + Math.random() * (max - min)); }

    function simulatedValues(key, employee) {
      if (key === 'tensi') return { systolic: rand(115, 135), diastolic: rand(75, 88), heartRate: rand(68, 82) };
      if (key === 'thermo') return { temperature: Math.round((36.2 + Math.random() * 1.0) * 10) / 10 };
      if (key === 'spo2') return { spo2: rand(96, 99), heartRate: rand(66, 80) };
      const h = employee && employee.heightCm ? employee.heightCm : 170;
      return { weightKg: Math.round(h * 0.43 * 10) / 10 };
    }

    /* --- Pengukuran: notifikasi GATT nyata; simulasi hanya bila GATT tak tersedia --- */
    function simulateMeasure(key, employee, onProgress, reason) {
      return new Promise((resolve) => {
        let pct = 0;
        onProgress && onProgress(0, 0);
        const tick = () => {
          if (btCancelled) {
            onProgress && onProgress(0, 0);
            return resolve({ ok: false, cancelled: true });
          }
          pct += rand(8, 18);
          if (pct >= 100) {
            onProgress && onProgress(100, 0);
            btLogPush(key, 'hasil', 'SIMULASI — ' + (reason || '-'));
            return resolve({
              ok: true, simulated: true, values: simulatedValues(key, employee),
              reason: reason || 'Perangkat mode simulasi aktif.',
            });
          }
          onProgress && onProgress(pct, 0);
          setTimeout(tick, 380);
        };
        setTimeout(tick, 380);
      });
    }

    function bluetoothMeasure(key, employee, onProgress) {
      btCancelled = false;
      const handle = BT[key];
      const isReal = !!(handle && handle.characteristic && !handle.simulated);

      if (!isReal) {
        return simulateMeasure(key, employee, onProgress,
          handle ? 'Perangkat mode simulasi aktif.' : 'Koneksi GATT tidak tersedia — hasil pengukuran simulasi.');
      }

      const buffered = (handle.buffer || []).filter((f) => f.ok && !frameIsOld(f) && (Date.now() - f.t) <= BT_FRAME_MAX_AGE);
      const bufPick = key === 'scale' ? btPickScale(buffered) : (buffered.length ? buffered[buffered.length - 1] : null);
      if (bufPick) {
        handle.buffer = [];
        onProgress && onProgress(100, 0);
        btLogPush(handle.deviceName, 'hasil', 'dipakai dari buffer (sebelum tombol ditekan): ' + JSON.stringify(bufPick.values));
        return Promise.resolve({ ok: true, simulated: false, values: bufPick.values });
      }
      const preCand = btStableCand(handle.buffer);
      if (preCand != null) {
        const vals = Object.assign({}, handle.buffer[handle.buffer.length - 1].values, { spo2: preCand, heartRate: null });
        handle.buffer = [];
        onProgress && onProgress(100, 0);
        btLogPush(handle.deviceName, 'hasil', 'dipakai dari buffer (kandidat stabil): ' + JSON.stringify(vals));
        return Promise.resolve({ ok: true, simulated: false, values: vals });
      }

      return (async () => {
        const attached = await btAttach(key);
        if (btCancelled) return { ok: false, cancelled: true };

        const props = (handle.characteristic && handle.characteristic.properties) || {};
        const canRead = !!props.read;

        if (!attached && !canRead) {
          return {
            ok: false,
            reason: 'Tidak bisa menerima data dari alat (tanpa notifikasi & tanpa read) — periksa panel Detail di kartu perangkat, atau gunakan input manual.',
          };
        }

        let baselineHex = null;
        let candVal = null;
        let candOk = 0;
        if (canRead && key === 'scale') {
          // Timbangan (mis. IF_B2A): read = buffer status nol, bobot hanya lewat notifikasi — baseline dilewati
          // agar Mulai langsung siap (hemat hingga 4 dtk; jendela hasil alat hanya ±3 dtk). Polling tetap jalan
          // sebagai cadangan dan nilai read identik tidak lagi ditahan oleh logika "sama dengan baseline".
          btLogPush(handle.deviceName, 'baca', 'baseline dilewati (timbangan: bobot lewat notifikasi)');
        } else if (canRead) {
          try {
            const dv0 = await btReadValue(handle.characteristic);
            const base = btParseFrame(key, dv0, handle, false);
            baselineHex = base.hex;
            if (key === 'spo2' && !base.ok && base.values && base.values.cand && base.values.cand.length) {
              candVal = base.values.cand[0];
              candOk = 1;
            }
            btLogPush(handle.deviceName, 'baca', 'baseline hex ' + base.hex + ' · len ' + base.len +
              (base.ok ? ' (nilai terkini, hanya pembanding)'
                : (candOk ? ' (kandidat ' + candVal + ' konfirmasi 1/' + BT_SPO2_STABLE_READS + ')' : ' (' + (base.error || '-') + ')')));
          } catch (e) {
            btLogPush(handle.deviceName, 'baca', 'baseline readValue gagal: ' + ((e && e.message) || '-'));
          }
          if (btCancelled) return { ok: false, cancelled: true };
        }

        return await new Promise((resolve) => {
          const startedAt = Date.now();
          let done = false;
          let iv = null;
          let pollIv = null;
          let timeoutId = null;
          let reads = 0;
          let notifyCount = 0;
          let stableOk = 0;
          let polling = false;
          let lastScaleFrame = null;
          let onDisc = null;

          function cleanup() {
            handle.onFrame = null;
            if (onDisc && handle.device && typeof handle.device.removeEventListener === 'function') {
              handle.device.removeEventListener('gattserverdisconnected', onDisc);
            }
            if (iv) clearInterval(iv);
            if (pollIv) clearInterval(pollIv);
            if (timeoutId) clearTimeout(timeoutId);
          }

          function settle(result) {
            if (done) return;
            done = true;
            cleanup();
            resolve(result);
          }

          if (handle.device && typeof handle.device.addEventListener === 'function') {
            onDisc = () => {
              if (done) return;
              if (key === 'scale' && lastScaleFrame) {
                onProgress && onProgress(100, 0);
                btLogPush(handle.deviceName, 'hasil', 'koneksi terputus — pakai bobot terakhir: ' + JSON.stringify(lastScaleFrame));
                handle.buffer = [];
                settle({ ok: true, simulated: false, values: lastScaleFrame, disconnected: true });
              } else {
                btLogPush(handle.deviceName, 'putus', 'koneksi terputus sebelum data diterima');
                settle({ ok: false, reason: 'Koneksi terputus sebelum data diterima — nyalakan ulang alat lalu ulangi pengukuran.' });
              }
            };
            handle.device.addEventListener('gattserverdisconnected', onDisc);
          }

          const early = (handle.buffer || []).filter((f) => f.ok && !frameIsOld(f) && (Date.now() - f.t) <= BT_FRAME_MAX_AGE);
          const earlyPick = key === 'scale' ? btPickScale(early) : (early.length ? early[early.length - 1] : null);
          if (earlyPick) {
            onProgress && onProgress(100, 0);
            btLogPush(handle.deviceName, 'hasil', 'via notifikasi (saat mulai): ' + JSON.stringify(earlyPick.values));
            handle.buffer = [];
            return settle({ ok: true, simulated: false, values: earlyPick.values });
          }
          const earlyCand = btStableCand(handle.buffer);
          if (earlyCand != null) {
            const vals = Object.assign({}, handle.buffer[handle.buffer.length - 1].values, { spo2: earlyCand, heartRate: null });
            onProgress && onProgress(100, 0);
            btLogPush(handle.deviceName, 'hasil', 'via notifikasi (kandidat stabil): ' + JSON.stringify(vals));
            handle.buffer = [];
            return settle({ ok: true, simulated: false, values: vals });
          }

          handle.onFrame = (frame) => {
            if (done) return;
            notifyCount++;
            if (btCancelled) return settle({ ok: false, cancelled: true });
            if (!frame.ok) {
              if (key === 'spo2') {
                const pick = btStableCand(handle.buffer);
                if (pick != null) {
                  const vals = Object.assign({}, frame.values, { spo2: pick, heartRate: null });
                  onProgress && onProgress(100, 0);
                  btLogPush(handle.deviceName, 'hasil', 'via notifikasi (kandidat stabil): ' + JSON.stringify(vals));
                  handle.buffer = [];
                  settle({ ok: true, simulated: false, values: vals });
                }
              }
              return;
            }
            if (frameIsOld(frame)) {
              btLogPush(handle.deviceName, 'abaikan', 'data riwayat lama: ' + frame.hex);
              return;
            }
            if (key === 'scale') lastScaleFrame = frame.values;
            onProgress && onProgress(100, 0);
            btLogPush(handle.deviceName, 'hasil', 'via notifikasi: ' + JSON.stringify(frame.values));
            handle.buffer = [];
            settle({ ok: true, simulated: false, values: frame.values });
          };

          async function pollRead() {
            if (done || polling || btCancelled || !canRead) return;
            polling = true;
            try {
              const dv = await btReadValue(handle.characteristic);
              reads++;
              const frame = btParseFrame(key, dv, handle, false);
              const old = frameIsOld(frame);
              if (key === 'scale' && frame.ok && !old) lastScaleFrame = frame.values;
              const changed = baselineHex === null || frame.hex !== baselineHex;
              const hold = frame.ok && !old && !changed && key === 'spo2';
              if (hold) stableOk++; else stableOk = 0;
              const stable = hold && stableOk >= BT_SPO2_STABLE_READS;
              const accept = frame.ok && !old && (changed || stable);
              let hadCand = false;
              let candPick = null;
              if (!frame.ok) {
                if (key === 'spo2' && frame.values && frame.values.cand && frame.values.cand.length) {
                  hadCand = true;
                  const c = frame.values.cand[0];
                  if (c === candVal) candOk++; else { candVal = c; candOk = 1; }
                  if (candOk >= BT_SPO2_STABLE_READS) candPick = c;
                } else {
                  candVal = null;
                  candOk = 0;
                }
              }
              btLogPush(handle.deviceName, 'baca', '#' + reads + ' hex ' + frame.hex + ' · len ' + frame.len + ' → ' +
                (accept ? (changed ? 'DITERIMA' : 'DITERIMA (nilai stabil di alat)')
                  : candPick != null ? 'DITERIMA (kandidat stabil)'
                  : !frame.ok ? 'GAGAL: ' + frame.error +
                      (hadCand ? ' · kandidat ' + candVal + ' (konfirmasi ' + candOk + '/' + BT_SPO2_STABLE_READS + ')' : '')
                  : old ? 'riwayat lama'
                  : hold ? 'sama dengan baseline (konfirmasi ' + stableOk + '/' + BT_SPO2_STABLE_READS + ')'
                  : 'sama dengan baseline'));
              if (accept) {
                onProgress && onProgress(100, 0);
                btLogPush(handle.deviceName, 'hasil',
                  (changed ? 'via polling read: ' : 'via polling read (nilai stabil di alat): ') + JSON.stringify(frame.values));
                handle.buffer = [];
                settle({ ok: true, simulated: false, values: frame.values });
              }
              if (candPick != null) {
                const vals = Object.assign({}, frame.values, { spo2: candPick, heartRate: null });
                onProgress && onProgress(100, 0);
                btLogPush(handle.deviceName, 'hasil', 'via polling read (kandidat stabil): ' + JSON.stringify(vals));
                handle.buffer = [];
                settle({ ok: true, simulated: false, values: vals });
              }
            } catch (e) {
              btLogPush(handle.deviceName, 'baca', 'readValue gagal: ' + ((e && e.message) || '-'));
            } finally {
              polling = false;
            }
          }

          iv = setInterval(() => {
            if (btCancelled) return settle({ ok: false, cancelled: true });
            const elapsed = Date.now() - startedAt;
            const remain = Math.max(0, Math.ceil((BT_MEASURE_TIMEOUT - elapsed) / 1000));
            onProgress && onProgress(Math.min(95, Math.round((elapsed / BT_MEASURE_TIMEOUT) * 95)), remain);
          }, 500);

          // Timbangan dipol lebih cepat (maks 1 dtk) — cadangan notifikasi saat jendela hasil hanya ±3 dtk.
        if (canRead) pollIv = setInterval(pollRead, key === 'scale' ? Math.min(BT_POLL_INTERVAL, 1000) : BT_POLL_INTERVAL);

          timeoutId = setTimeout(() => {
            const frames = (handle.buffer || []).length;
            let reason;
            if (frames) {
              reason = 'Alat mengirim ' + frames + ' data tetapi tidak valid / terlalu lama — lihat panel Detail.';
            } else if (reads || notifyCount) {
              reason = 'Nilai alat terbaca ' + reads + '× / notifikasi ' + notifyCount + '× tetapi tidak berubah atau tidak valid dalam ' +
                Math.round(BT_MEASURE_TIMEOUT / 1000) + ' detik — tekan tombol di aplikasi lalu ukur ulang di alat.';
            } else {
              reason = 'Alat tidak mengirim data dalam ' + Math.round(BT_MEASURE_TIMEOUT / 1000) + ' detik — ukur di alat setelah menekan tombol.';
            }
            btLogPush(handle.deviceName, 'timeout', reason);
            settle({ ok: false, reason: reason, frames: frames, reads: reads });
          }, BT_MEASURE_TIMEOUT);
        });
      })();
    }

    /* ========== HASH ROUTER ========== */
    function parseHash() {
      const h = (location.hash || '#/login').replace(/^#/, '');
      const parts = h.split('/').filter(Boolean);
      return { page: parts[0] || 'login', query: parts[1] || '' };
    }

    /* ========== TOAST ========== */
    const toastState = reactive({ show: false, type: 'success', message: '', timer: null });
    function showToast(message, type = 'success') {
      if (toastState.timer) clearTimeout(toastState.timer);
      toastState.type = type;
      toastState.message = message;
      toastState.show = true;
      toastState.timer = setTimeout(() => { toastState.show = false; }, 3000);
    }

    /* ========== APP ROOT ========== */
    const App = {
      setup() {
        const route = ref(parseHash());
        const auth = reactive({
          loggedIn: sessionStorage.getItem('sf2w_session') === '1',
          user: JSON.parse(sessionStorage.getItem('sf2w_user') || 'null'),
        });
        const employees = ref(MOCK.employees.slice());
        const records = ref([]);
        const stats = ref({ totalToday: 0, fitToday: 0, unfitToday: 0, avgMinutes: 0, weekly: MOCK.weekly });
        const sidebarOpen = ref(true);

        function onHash() {
          route.value = parseHash();
          if (!auth.loggedIn && route.value.page !== 'login') {
            location.hash = '#/login';
          }
        }

        async function loadRecords() {
          const res = await apiPost('listRecords', {});
          if (res.ok) records.value = res.records || [];
        }

        async function loadStats() {
          const res = await apiPost('stats', {});
          if (res.ok) stats.value = res;
        }

        async function loadEmployees() {
          const res = await apiPost('listEmployees', {});
          if (res.ok) employees.value = res.employees || [];
        }

        async function loadDutyOfficers() {
          const res = await apiPost('listDutyOfficers', {});
          if (res.ok && res.officers) {
            const overrides = {};
            res.officers.forEach((o) => {
              overrides[o.id] = { name: o.name, role: o.role };
            });
            sessionStorage.setItem('sf2w_duty_overrides', JSON.stringify(overrides));
            window.dispatchEvent(new CustomEvent('sf2w:duty-changed', { detail: { id: sessionStorage.getItem('sf2w_duty') || '' } }));
          }
        }

        function onEmployeeAdded(e) {
          const emp = e.detail;
          if (!emp || !emp.id) return;
          const i = employees.value.findIndex((x) => x.id === emp.id);
          if (i >= 0) employees.value.splice(i, 1, emp);
          else employees.value.push(emp);
        }

        async function doLogin(pin) {
          const res = await apiPost('login', { pin });
          if (res.ok) {
            auth.loggedIn = true;
            auth.user = res.user;
            sessionStorage.setItem('sf2w_session', '1');
            sessionStorage.setItem('sf2w_user', JSON.stringify(res.user));
            showToast('Login berhasil. Selamat datang.');
            location.hash = '#/dashboard';
            return true;
          }
          showToast(res.message || 'Login gagal', 'error');
          return false;
        }

        function doLogout() {
          auth.loggedIn = false;
          auth.user = null;
          sessionStorage.removeItem('sf2w_session');
          sessionStorage.removeItem('sf2w_user');
          location.hash = '#/login';
        }

        function navigate(page) {
          location.hash = '#/' + page;
        }

        async function saveRecord(payload) {
          const res = await apiPost('saveRecord', payload);
          if (res.ok) {
            const record = { ...payload, id: res.id };
            if (res.duplicate) {
              if (!records.value.some((r) => r.id === res.id)) records.value.unshift(record);
              await loadStats();
              showToast('Data sudah tersimpan sebelumnya — pengulangan diabaikan.');
              return true;
            }
            records.value.unshift(record);
            await loadStats();
            showToast('Data pemeriksaan tersimpan.');
            return true;
          }
          showToast(res.message || 'Gagal menyimpan', 'error');
          return false;
        }

        onMounted(async () => {
          window.addEventListener('hashchange', onHash);
          window.addEventListener('sf2w:employee-added', onEmployeeAdded);
          if (auth.loggedIn) {
            await Promise.all([loadRecords(), loadStats(), loadEmployees(), loadDutyOfficers()]);
          }
          onHash();
        });

        onUnmounted(() => {
          window.removeEventListener('hashchange', onHash);
          window.removeEventListener('sf2w:employee-added', onEmployeeAdded);
        });

        watch(() => auth.loggedIn, async (v) => {
          if (v) await Promise.all([loadRecords(), loadStats(), loadEmployees(), loadDutyOfficers()]);
        });

        return {
          route, auth, employees, records, stats, sidebarOpen,
          doLogin, doLogout, navigate, saveRecord, loadRecords, loadStats,
          toast: toastState, showToast,
        };
      },
      template: `
        <div class="min-h-screen">
          <LoginPage v-if="route.page === 'login'" :on-login="doLogin" />
          <AppShell
            v-else
            :auth="auth"
            :page="route.page"
            :sidebar-open="sidebarOpen"
            @toggle-sidebar="sidebarOpen = !sidebarOpen"
            @logout="doLogout"
            @navigate="navigate"
          >
            <DashboardPage v-if="route.page === 'dashboard'" :stats="stats" :records="records" @navigate="navigate" />
            <PemeriksaanPage
              v-else-if="route.page === 'pemeriksaan'"
              :employees="employees"
              :on-save="saveRecord"
              @navigate="navigate"
            />
            <MonitoringPage
              v-else-if="route.page === 'monitoring'"
              :records="records"
              @refresh="loadRecords"
            />
            <PengaturanPage v-else-if="route.page === 'pengaturan'" />
            <DashboardPage v-else :stats="stats" :records="records" @navigate="navigate" />
          </AppShell>
          <ToastHost />
        </div>
      `,
    };

    /* ========== TOAST COMPONENT ========== */
    const ToastHost = {
      setup() {
        return { toast: toastState };
      },
      template: `
        <transition name="fade">
          <div
            v-if="toast.show"
            class="fixed bottom-6 right-6 z-[9999] min-w-[260px] max-w-sm rounded-xl px-4 py-3 shadow-lift text-white text-sm font-medium"
            :class="toast.type === 'error' ? 'bg-danger' : 'bg-success'"
            role="status"
          >
            {{ toast.message }}
          </div>
        </transition>
      `,
    };

    /* ========== LOGIN ========== */
    const LoginPage = {
      props: ['onLogin'],
      setup(props) {
        const pin = ref('');
        const loading = ref(false);
        const error = ref('');

        async function submit() {
          if (pin.value.length < 4) {
            error.value = 'PIN minimal 4 digit';
            return;
          }
          loading.value = true;
          error.value = '';
          const ok = await props.onLogin(pin.value);
          if (!ok) error.value = 'PIN salah. Coba lagi.';
          loading.value = false;
          pin.value = '';
        }

        return { pin, loading, error, submit };
      },
      template: `

              </div>
              <div>
                <h1 class="text-xl font-bold text-ink">SMART FIT2WORK</h1>

    /* ========== APP SHELL ========== */
    const AppShell = {
      props: ['auth', 'page', 'sidebarOpen'],
      emits: ['toggle-sidebar', 'logout', 'navigate'],
      setup(props, { emit }) {
        const search = ref('');
        const searchResults = ref([]);
        let debounceTimer = null;

        const mainMenu = [
          { key: 'dashboard', label: 'Dashboard', icon: 'grid' },
          { key: 'pemeriksaan', label: 'Pemeriksaan', icon: 'heart' },
          { key: 'monitoring', label: 'Monitoring HSSE', icon: 'table' },
        ];
        const genMenu = [
          { key: 'dashboard', label: 'Laporan', icon: 'chart' },
