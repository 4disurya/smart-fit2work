          return String(raw).replace(/[-:\s]/g, '').toUpperCase();
        }

        function startScan(mode) {
          scan.active = true;
          scan.mode = mode;
          scan.uid = '';
          scan.remain = 15;
          if (scanTimer) clearTimeout(scanTimer);
          if (scanInterval) clearInterval(scanInterval);
          scanInterval = setInterval(() => {
            scan.remain--;
            if (scan.remain <= 0) cancelScan();
          }, 1000);
          scanTimer = setTimeout(() => { cancelScan(); }, 15000);
        }

        function cancelScan() {
          scan.active = false;
          scan.uid = '';
          if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
          if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
        }

        async function commitScan(rawUid) {
          const uid = normalizeUid(rawUid);
          cancelScan();
          if (!/^[A-Z0-9]{4,32}$/.test(uid)) {
            window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: 'Format UID tidak valid (4-32 karakter)', type: 'error' } }));
            return;
          }
          if (scan.mode === 'select') {
            const emp = (props.employees || []).find((e) => String(e.cardUid || '').toUpperCase() === uid);
            if (emp) {
              pick(emp);
              window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: 'Kartu terbaca — ' + emp.name + ' dipilih.', type: 'success' } }));
            } else {
              window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: 'Kartu belum terdaftar (' + uid + ') — pilih karyawan lalu klik Daftarkan Kartu.', type: 'error' } }));
            }
          } else if (scan.mode === 'register') {
            if (!selected.value) return;
            const res = await apiPost('saveEmployeeCard', { employeeId: selected.value.id, cardUid: uid });
            if (res.ok && res.employee) {
              selected.value = res.employee;
              window.dispatchEvent(new CustomEvent('sf2w:employee-added', { detail: res.employee }));
              window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: 'Kartu berhasil didaftarkan untuk ' + res.employee.name, type: 'success' } }));
            } else {
              window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: res.message || 'Gagal mendaftar kartu', type: 'error' } }));
            }
          }
        }

        async function unregisterCard() {
          if (!selected.value) return;
          const res = await apiPost('saveEmployeeCard', { employeeId: selected.value.id, cardUid: '' });
          if (res.ok && res.employee) {
            selected.value = res.employee;
            window.dispatchEvent(new CustomEvent('sf2w:employee-added', { detail: res.employee }));
            window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: 'Kartu berhasil dilepas dari ' + res.employee.name, type: 'success' } }));
          } else {
            window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: res.message || 'Gagal melepas kartu', type: 'error' } }));
          }
        }

        function onKeyDown(e) {
          if (scan.active) {
            if (e.key === 'Escape') {
              cancelScan();
            } else if (e.key === 'Enter' || e.key === 'Tab') {
              e.preventDefault();
              if (scan.uid.length >= 4) commitScan(scan.uid);
              else cancelScan();
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
              e.preventDefault();
              if (/[a-zA-Z0-9]/.test(e.key)) scan.uid += e.key;
            }
            return;
          }
          
          if (!selected.value) {
            const now = Date.now();
            const gap = now - lastKeyTime;
            if (gap > 80) {
              passiveBuf = '';
            }
            lastKeyTime = now;
            if (e.key === 'Enter' || e.key === 'Tab') {
              if (passiveBuf.length >= 4 && gap <= 80) {
                const uid = passiveBuf;
                passiveBuf = '';
                query.value = '';
                queryResults.value = [];
                resetForm();
                scan.mode = 'select';
                commitScan(uid);
              }
              passiveBuf = '';
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
              if (/[a-zA-Z0-9]/.test(e.key)) passiveBuf += e.key;
              else passiveBuf = '';
            }
          }
        }

        const addOpen = ref(false);
        const addingEmp = ref(false);
        const addError = ref('');
        const addForm = reactive({ name: '', unit: '', grup: '', dob: '', heightCm: null });
        const unitOptions = computed(() => {
          const set = {};
          (props.employees || []).forEach((e) => { if (e.unit) set[e.unit] = true; });
          return Object.keys(set);
        });
        const todayStr = new Date().toISOString().slice(0, 10);

        const qOpen = ref(false);
        const qAnswers = reactive({});
        let saveTs = null;
        function resetQ() {
          Q_KEYS.forEach((k) => { qAnswers[k] = ''; });
          qOpen.value = false;
        }
        resetQ();
        const qAnswered = computed(() => Q_KEYS.filter((k) => qAnswers[k] === 'ya' || qAnswers[k] === 'tidak').length);
        const qComplete = computed(() => qAnswered.value === Q_KEYS.length);

        function closeQ() {
          qOpen.value = false;
        }

        const devices = reactive({
          tensi: { connected: false, loading: false, label: 'Tensi Meter', error: '', note: '', name: '', simulated: false, measuring: false, progress: 0, remain: 0, measured: false },
          thermo: { connected: false, loading: false, label: 'Termometer', error: '', note: '', name: '', simulated: false, measuring: false, progress: 0, remain: 0, measured: false },
          spo2: { connected: false, loading: false, label: 'SPO2', error: '', note: '', name: '', simulated: false, measuring: false, progress: 0, remain: 0, measured: false },
          scale: { connected: false, loading: false, label: 'Timbangan', error: '', note: '', name: '', simulated: false, measuring: false, progress: 0, remain: 0, measured: false },
        });

        const fillSource = reactive({
          systolic: null, diastolic: null, temperature: null,
          spo2: null, heartRate: null, weightKg: null,
        });

        const btLog = ref(getBtLog());
        const logOpen = ref(false);

        function onBtLog(e) {
          btLog.value = (e.detail || []).slice();
        }

        function fmtLogTime(iso) {
          const d = new Date(iso);
          if (isNaN(d)) return '-';
          return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function srcTagRaw(field) {
          if (manualFields[field]) return 'manual';
          return fillSource[field] || '';
        }

        function srcTag(field) {
          const r = srcTagRaw(field);
          return r === 'alat' ? 'Alat' : r === 'simulasi' ? 'Simulasi' : r === 'manual' ? 'Manual' : '';
        }

        function srcTagCls(field) {
          const r = srcTagRaw(field);
          if (r === 'alat') return 'bg-iconbg text-primary';
          if (r === 'simulasi') return 'bg-danger/10 text-danger';
          if (r === 'manual') return 'bg-canvas text-muted border border-line';
          return '';
        }

        const form = reactive({
          systolic: null, diastolic: null, temperature: null,
          spo2: null, heartRate: null, weightKg: null,
          manualMode: false, reason: '',
        });

        const manualFields = reactive({
          systolic: false, diastolic: false, temperature: false,
          spo2: false, heartRate: false, weightKg: false,
        });

        const saving = ref(false);

        const bmi = computed(() => {
          if (!selected.value) return null;
          return calcBmi(form.weightKg, selected.value.heightCm);
        });

        const status = computed(() => calcStatus(form.systolic, form.temperature));

        const alerts = computed(() => {
          const list = [];
          if (form.systolic != null && (form.systolic > 140 || form.diastolic > 90)) {
            list.push('Tekanan darah tinggi: ' + form.systolic + '/' + form.diastolic);
          }
          if (form.temperature != null && form.temperature > 37.5) {
            list.push('Suhu di atas normal: ' + form.temperature + '°C');
          }
          if (form.spo2 != null && form.spo2 < 95) {
            list.push('SPO2 rendah: ' + form.spo2 + '%');
          }
          return list;
        });

        const canSave = computed(() => {
          if (!selected.value) return false;
          return (
            form.systolic != null && form.diastolic != null &&
            form.temperature != null && form.spo2 != null &&
            form.weightKg != null &&
            form.systolic > 0 && form.diastolic > 0 &&
            form.temperature > 0 && form.spo2 > 0 &&
            form.weightKg > 0
          );
        });

        function onSearch() {
          if (debounceTimer) clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            const q = query.value.trim().toLowerCase();
            if (!q) { queryResults.value = []; noMatch.value = false; return; }
            const res = (props.employees || [])
              .filter((e) => e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q))
              .slice(0, 6);
            queryResults.value = res;
            noMatch.value = res.length === 0;
          }, 300);
        }

        function pick(emp) {
          selected.value = emp;
          query.value = '';
          queryResults.value = [];
          noMatch.value = false;
        }

        function clearSelection() {
          selected.value = null;
          query.value = '';
          queryResults.value = [];
          noMatch.value = false;
          resetForm();
        }

        function openAdd() {
          const q = query.value.trim();
          addForm.name = /^K-\d+$/i.test(q) ? '' : q;
          addForm.unit = '';
          addForm.grup = '';
          addForm.dob = '';
          addForm.heightCm = null;
          addError.value = '';
          addOpen.value = true;
        }

        function closeAdd() {
          addOpen.value = false;
          addError.value = '';
        }

        async function submitEmployee() {
          const name = String(addForm.name || '').trim();
          const unit = String(addForm.unit || '').trim();
          const grup = String(addForm.grup || '').trim().toUpperCase();
          const dob = String(addForm.dob || '').trim();
          if (!name) { addError.value = 'Nama lengkap wajib diisi'; return; }
          if (!unit) { addError.value = 'Unit wajib diisi'; return; }
          if (!grup || !/^[A-D]$/.test(grup)) { addError.value = 'Grup tugas wajib dipilih (A, B, C, atau D)'; return; }
          if (!dob) { addError.value = 'Tanggal lahir wajib diisi'; return; }
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dob) || isNaN(Date.parse(dob)) || Date.parse(dob) > Date.now()) {
            addError.value = 'Tanggal lahir tidak valid';
            return;
          }
          if (addForm.heightCm === null || addForm.heightCm === '' || addForm.heightCm === undefined) {
            addError.value = 'Tinggi badan wajib diisi';
            return;
          }
          const h = Number(addForm.heightCm);
          if (!isFinite(h)) { addError.value = 'Tinggi badan bukan angka yang valid'; return; }
          if (h < 50 || h > 250) { addError.value = 'Tinggi badan di luar rentang 50-250'; return; }
          addingEmp.value = true;
          addError.value = '';
          const res = await apiPost('addEmployee', { name, unit, grup, dob, heightCm: h });
          addingEmp.value = false;
          if (res.ok && res.employee) {
            window.dispatchEvent(new CustomEvent('sf2w:employee-added', { detail: res.employee }));
            window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: 'Karyawan berhasil ditambahkan.', type: 'success' } }));
            addOpen.value = false;
            pick(res.employee);
            setTimeout(() => {
              startScan('register');
              window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: 'Tempelkan kartu RFID untuk mendaftarkannya ke ' + res.employee.name } }));
            }, 500);
          } else {
            addError.value = res.message || 'Gagal menambah karyawan';
          }
        }

        function resetForm() {
          btClearMeasure();
          resetQ();
          saveTs = null;
          form.systolic = null; form.diastolic = null; form.temperature = null;
          form.spo2 = null; form.heartRate = null; form.weightKg = null;
          form.manualMode = false; form.reason = '';
          Object.keys(manualFields).forEach((k) => { manualFields[k] = false; });
          Object.keys(fillSource).forEach((k) => { fillSource[k] = null; });
          Object.keys(devices).forEach((k) => {
            devices[k].connected = false;
            devices[k].error = '';
            devices[k].note = '';
            devices[k].name = '';
            devices[k].simulated = false;
            devices[k].measuring = false;
            devices[k].measured = false;
            devices[k].progress = 0;
            devices[k].remain = 0;
            if (k !== 'scale') btDisconnect(k);
          });
          if (BT.scale && BT.scale.characteristic && !BT.scale.simulated) {
            devices.scale.connected = true;
            devices.scale.name = BT.scale.deviceName + ' (auto)';
            devices.scale.note = 'Terhubung otomatis — bobot masuk langsung saat dikirim.';
          } else if (BTPaired.scale) {
            devices.scale.note = 'Auto-reconnect aktif — menunggu perangkat aktif.';
          }
        }

        async function connect(key) {
          const d = devices[key];
          d.loading = true;
          d.error = '';
          d.note = '';
          const res = await bluetoothConnect(key);
          d.loading = false;
          if (res.ok) {
            d.connected = true;
            d.simulated = !!res.simulated;
            d.name = res.device || d.label;
            d.note = res.simulated ? (res.message || '') : '';
            d.measured = false;
            d.progress = 0;
            d.measuring = false;
            const toastType = res.simulated ? 'error' : 'success';
            window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: res.message || (d.label + ' terhubung: ' + d.name), type: toastType } }));
          } else if (res.cancelled) {
            d.connected = false;
            d.simulated = false;
            d.name = '';
            d.note = '';
            d.error = res.message;
            window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: d.label + ': ' + res.message, type: 'error' } }));
          } else {
            d.connected = false;
            d.simulated = false;
            d.name = '';
            d.error = res.reconnecting ? '' : (res.message || 'Gagal — gunakan Input Manual');
            d.note = res.reconnecting ? (res.message || 'Menunggu perangkat aktif (auto-reconnect)…') : '';
            if (!res.reconnecting && !res.rechoose) {
              manualFields[key === 'tensi' ? 'systolic' : key === 'thermo' ? 'temperature' : key === 'spo2' ? 'spo2' : 'weightKg'] = true;
              form.manualMode = true;
            }
            window.dispatchEvent(new CustomEvent('sf2w:toast', {
              detail: {
                message: res.reconnecting
                  ? (d.label + ': ' + d.note)
                  : d.label + ' gagal — ' + (res.message || 'input manual aktif'),
                type: 'error',
              },
            }));
          }
        }

        function applyMeasurement(key, values, simulated) {
          if (!values) return;
          const src = simulated ? 'simulasi' : 'alat';
          if (key === 'tensi') {
            if (values.systolic != null) { form.systolic = values.systolic; manualFields.systolic = false; fillSource.systolic = src; }
            if (values.diastolic != null) { form.diastolic = values.diastolic; manualFields.diastolic = false; fillSource.diastolic = src; }
            if (values.heartRate != null && !manualFields.heartRate) { form.heartRate = values.heartRate; fillSource.heartRate = src; }
          } else if (key === 'thermo') {
            if (values.temperature != null) { form.temperature = values.temperature; manualFields.temperature = false; fillSource.temperature = src; }
          } else if (key === 'spo2') {
            if (values.spo2 != null) { form.spo2 = values.spo2; manualFields.spo2 = false; fillSource.spo2 = src; }
          } else if (key === 'scale') {
            if (values.weightKg != null) { form.weightKg = values.weightKg; manualFields.weightKg = false; fillSource.weightKg = src; }
          }
        }

        function anyMeasuring() {
          return Object.keys(devices).some((k) => devices[k].measuring);
        }

        async function startMeasurement(key) {
          const d = devices[key];
          if (!selected.value) {
            window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: 'Pilih karyawan terlebih dahulu.', type: 'error' } }));
            return;
          }
          if (!d.connected || d.measuring) return;
          if (anyMeasuring()) {
            window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: 'Masih ada pengukuran yang berjalan.', type: 'error' } }));
            return;
          }
          d.measuring = true;
          d.progress = 0;
          d.remain = 0;
          d.measured = false;
          d.error = '';
          try {
            const res = await bluetoothMeasure(key, selected.value, (pct, remain) => {
              d.progress = pct;
              d.remain = remain || 0;
            });
            if (res.cancelled) {
              d.progress = 0;
              return;
            }
            if (res.ok && res.values) {
              applyMeasurement(key, res.values, !!res.simulated);
              d.measured = true;
              d.simulated = !!res.simulated;
              d.error = '';
              window.dispatchEvent(new CustomEvent('sf2w:toast', {
                detail: res.simulated
                  ? { message: d.label + ' — data SIMULASI terisi ke form (bukan hasil alat).', type: 'error' }
                  : { message: d.label + ' — data asli dari alat terisi ke form.', type: 'success' },
              }));
            } else {
              d.measured = false;
              d.simulated = false;
              d.error = res.reason || 'Tidak ada data dari alat — ulangi atau gunakan input manual.';
              window.dispatchEvent(new CustomEvent('sf2w:toast', {
                detail: { message: d.label + ': ' + d.error, type: 'error' },
              }));
            }
          } catch (err) {
            d.measured = false;
            d.error = (err && err.message) || 'Pengukuran gagal';
            window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: d.label + ': ' + d.error, type: 'error' } }));
          } finally {
            d.measuring = false;
            d.remain = 0;
            d.progress = d.measured ? 100 : 0;
          }
        }

        function onDisconnected(e) {
          const key = e.detail && e.detail.key;
          if (!key || !devices[key]) return;
          devices[key].connected = false;
          devices[key].simulated = false;
          devices[key].measuring = false;
          devices[key].progress = 0;
          devices[key].name = '';
          devices[key].error = 'Terputus';
          devices[key].note = '';
          window.dispatchEvent(new CustomEvent('sf2w:toast', { detail: { message: e.detail.label + ' terputus.', type: 'error' } }));
        }

        let autoToastTimer = null;

        function onAutoValue(e) {
          const det = e.detail || {};
          if (det.key !== 'scale' || !det.values || !selected.value) return;
          const d = devices.scale;
          if (d.measuring) return;
          applyMeasurement('scale', det.values, false);
          d.measured = true;
          d.simulated = false;
          d.error = '';
          if (autoToastTimer) clearTimeout(autoToastTimer);
          autoToastTimer = setTimeout(() => {
            autoToastTimer = null;
            window.dispatchEvent(new CustomEvent('sf2w:toast', {
              detail: { message: 'Bobot dari timbangan tersimpan: ' + det.values.weightKg + ' kg.', type: 'success' },
            }));
          }, 2500);
        }

        function onReconnected(e) {
          const key = e.detail && e.detail.key;
          if (!key || !devices[key]) return;
          const d = devices[key];
          d.connected = true;
          d.simulated = false;
          d.name = (e.detail.name || d.label) + ' (auto)';
          d.error = '';
          d.note = 'Terhubung otomatis — bobot masuk langsung saat dikirim.';
          d.measuring = false;
          d.progress = 0;
          window.dispatchEvent(new CustomEvent('sf2w:toast', {
            detail: { message: d.label + ' terhubung otomatis — siap menerima data.', type: 'success' },
          }));
        }

        function onReconnFailed(e) {
          const key = e.detail && e.detail.key;
          if (!key || !devices[key]) return;
          devices[key].connected = false;
          devices[key].error = '';
          devices[key].note = 'Perangkat tidak dapat dihubungi — ' + ((e.detail && e.detail.message) || 'periksa alat');
        }

        function fillMockValues(key) {
          if (key === 'tensi') { form.systolic = 125; form.diastolic = 80; }
          if (key === 'thermo') form.temperature = 36.6;
          if (key === 'spo2') { form.spo2 = 98; form.heartRate = 72; }
          if (key === 'scale') form.weightKg = selected.value ? Math.round(selected.value.heightCm * 0.43 * 10) / 10 : 70;
        }

        function enableManual(key) {
          if (devices[key].measuring) btClearMeasure();
          devices[key].connected = false;
          devices[key].error = '';
          devices[key].note = '';
          devices[key].name = '';
          devices[key].simulated = false;
          devices[key].measuring = false;
          devices[key].measured = false;
          devices[key].progress = 0;
          btDisconnect(key);
          btUnpair(key);
          if (key === 'tensi') { manualFields.systolic = true; manualFields.diastolic = true; }
          if (key === 'thermo') manualFields.temperature = true;
          if (key === 'spo2') { manualFields.spo2 = true; manualFields.heartRate = true; }
          if (key === 'scale') manualFields.weightKg = true;
          form.manualMode = true;
        }

        function deviceChip(key) {
          const d = devices[key];
          if (d.loading) return { text: 'Menghubungkan…', cls: 'text-primary' };
          if (d.measuring) return { text: d.progress + '%', cls: 'text-primary' };
          if (d.connected && d.measured) return { text: d.simulated ? 'Terukur (sim)' : 'Terukur', cls: 'text-success' };
          if (d.connected && d.error) return { text: 'Gagal', cls: 'text-danger' };
          if (d.connected) return { text: d.simulated ? 'Simulasi' : 'Terhubung', cls: 'text-success' };
          if (d.error) return { text: 'Terputus', cls: 'text-danger' };
          return { text: 'Belum', cls: 'text-muted' };
        }

        async function submitSave() {
          if (!canSave.value || saving.value) return;
          if (!qComplete.value) {
            qOpen.value = true;
            return;
          }
          saving.value = true;
          const duty = readDuty();
          const isManual = Object.values(manualFields).some(Boolean);
          const isSimulated = Object.keys(devices).some((k) => devices[k].measured && devices[k].simulated);
          const isBluetooth = Object.keys(devices).some((k) => devices[k].measured && !devices[k].simulated);
          const source = isManual ? 'Manual' : (isSimulated ? 'Simulasi' : (isBluetooth ? 'Bluetooth' : 'Manual'));
          const answers = {};
          Q_KEYS.forEach((k) => { answers[k] = qAnswers[k]; });
          if (!saveTs) saveTs = new Date().toISOString();
          const payload = {
            timestamp: saveTs,
            employeeId: selected.value.id,
            employeeName: selected.value.name,
            systolic: Number(form.systolic),
            diastolic: Number(form.diastolic),
            temperature: Number(form.temperature),
            spo2: Number(form.spo2),
            heartRate: Number(form.heartRate),
            weightKg: Number(form.weightKg),
            heightCm: selected.value.heightCm,
            bmi: bmi.value,
            status: status.value,
            source: source,
            reason: isManual
              ? (form.reason || 'Input manual tanpa alasan')
              : (isSimulated ? 'Pengukuran simulasi (GATT tidak tersedia)' : ''),
            examiner: duty ? duty.name : '',
            examinerRole: duty ? duty.role : '',
            answers: answers,
          };
          try {
            const ok = await props.onSave(payload);
            if (ok !== false) resetForm();
          } finally {
            saving.value = false;
          }
        }

        function onPicked(e) {
          pick(e.detail);
        }

        onMounted(() => {
          window.addEventListener('keydown', onKeyDown, true);
          window.addEventListener('sf2w:pick-employee', onPicked);
          window.addEventListener('sf2w:bt-disconnected', onDisconnected);
          window.addEventListener('sf2w:bt-log', onBtLog);
          window.addEventListener('sf2w:bt-auto', onAutoValue);
          window.addEventListener('sf2w:bt-connected', onReconnected);
          window.addEventListener('sf2w:bt-reconn-failed', onReconnFailed);
          btRestorePair('scale').then((dev) => {

          () => [form.systolic, form.temperature],
          () => {}

          <!-- Modal kuesioner sebelum simpan pemeriksaan -->
          <div v-if="qOpen" class="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/40 p-4" @click.self="closeQ">
            <div class="w-full max-w-xl bg-surface rounded-xl shadow-lift border border-line p-6 space-y-4 max-h-[85vh] overflow-y-auto" role="dialog" aria-label="Kuesioner Kesehatan">
              <div>
                <h3 class="text-lg font-bold text-ink">Kuesioner Kesehatan</h3>
                <p class="text-xs text-muted">Jawab 10 pertanyaan berikut sebelum menyimpan pemeriksaan — <span class="font-semibold text-primary">{{ qAnswered }}/10 terjawab</span>.</p>
              </div>
              <div v-for="(label, i) in Q_LABELS" :key="i" class="pb-3 border-b border-line last:border-0 last:pb-0">
                <p class="text-sm text-ink mb-2"><span class="text-primary font-semibold mr-1">{{ i + 1 }}.</span>{{ label }}</p>
                <div class="flex gap-2">
                  <button
                    class="flex-1 min-touch rounded-md text-sm font-semibold border transition-colors"
                    :class="qAnswers['q' + (i + 1)] === 'ya' ? 'bg-primary text-white border-primary' : 'border-line text-ink hover:bg-canvas'"
                    @click="qAnswers['q' + (i + 1)] = 'ya'"
                  >Ya</button>
                  <button
                    class="flex-1 min-touch rounded-md text-sm font-semibold border transition-colors"
                    :class="qAnswers['q' + (i + 1)] === 'tidak' ? 'bg-danger text-white border-danger' : 'border-line text-ink hover:bg-canvas'"
                    @click="qAnswers['q' + (i + 1)] = 'tidak'"
                  >Tidak</button>
                </div>
              </div>
              <div class="flex gap-2 pt-1 sticky bottom-0 bg-surface">
                <button class="flex-1 min-touch rounded-md border border-line text-sm font-semibold text-ink hover:bg-canvas"
                  :disabled="saving" @click="closeQ">Kembali</button>
                <button
                  class="flex-1 min-touch rounded-md text-white text-sm font-semibold disabled:opacity-50"
                  :class="status === 'UNFIT' ? 'bg-danger' : 'bg-primary'"
                  :disabled="!qComplete || saving"
                  @click="submitSave"
                >
                  <span v-if="saving" class="spinner align-middle mr-1"></span>{{ saving ? 'Menyimpan…' : 'Simpan Pemeriksaan' }}
                </button>
              </div>
              <p v-if="!qComplete" class="text-xs text-muted text-center">Semua pertanyaan wajib dijawab.</p>
            </div>
          </div>
        </div>
      `,
    };

    /* ========== MONITORING ========== */
    const MonitoringPage = {
      props: ['records'],
      emits: ['refresh'],
      setup(props) {
        const from = ref('');
        const to = ref('');
        const statusFilter = ref('ALL');
        const page = ref(1);
        const pageSize = 50;

        const filtered = computed(() => {
          let rows = (props.records || []).slice();
          if (from.value) {
            const f = new Date(from.value + 'T00:00:00').getTime();
            rows = rows.filter((r) => new Date(r.timestamp).getTime() >= f);
          }
          if (to.value) {
            const t = new Date(to.value + 'T23:59:59').getTime();
            rows = rows.filter((r) => new Date(r.timestamp).getTime() <= t);
          }
          if (statusFilter.value !== 'ALL') {
            rows = rows.filter((r) => r.status === statusFilter.value);
          }
          return rows;
        });

        const visible = computed(() => filtered.value.slice(0, pageSize));

        function exportCSV() {
          const csv = toCSV(filtered.value);
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'fit2work-pemeriksaan.csv';
          a.click();
          URL.revokeObjectURL(url);
          showToast('Export CSV berhasil (' + filtered.value.length + ' baris).');
        }

        function clearFilter() {
          from.value = '';
          to.value = '';
          statusFilter.value = 'ALL';
        }

        return { from, to, statusFilter, filtered, visible, exportCSV, clearFilter, fmtTime };
      },
      template: `
        <div class="space-y-6">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <div>
              <h2 class="text-xl font-bold text-ink">Monitoring HSSE</h2>
              <p class="text-sm text-muted">Riwayat pemeriksaan kelaikan kerja — maks. 50 record terbaru.</p>
            </div>
            <div class="flex gap-2">
              <button class="min-touch px-4 py-2.5 rounded-md border border-line text-sm font-medium text-ink bg-surface hover:bg-canvas" @click="$emit('refresh')">Muat ulang</button>
              <button class="min-touch px-4 py-2.5 rounded-md bg-primary text-white text-sm font-semibold" @click="exportCSV">Export CSV</button>
            </div>
          </div>

          <!-- Filters -->
          <div class="bg-surface rounded-lg shadow-card border border-line p-5 flex flex-wrap gap-4 items-end">
            <div>
              <label class="block text-xs font-medium text-muted mb-1">Dari tanggal</label>
              <input v-model="from" type="date" class="min-touch px-3 py-2.5 rounded-md border border-line bg-surface text-sm focus:outline-none focus:border-primary" />
            </div>
            <div>
              <label class="block text-xs font-medium text-muted mb-1">Sampai tanggal</label>
              <input v-model="to" type="date" class="min-touch px-3 py-2.5 rounded-md border border-line bg-surface text-sm focus:outline-none focus:border-primary" />
            </div>
            <div>
              <label class="block text-xs font-medium text-muted mb-1">Status</label>
              <select v-model="statusFilter" class="min-touch px-3 py-2.5 rounded-md border border-line bg-surface text-sm focus:outline-none focus:border-primary">
                <option value="ALL">Semua</option>
                <option value="FIT">FIT</option>
                <option value="UNFIT">UNFIT</option>
              </select>
            </div>
            <button class="min-touch px-4 py-2.5 rounded-md border border-line text-sm text-ink hover:bg-canvas" @click="clearFilter">Reset</button>
            <p class="text-sm text-muted ml-auto">{{ filtered.length }} data</p>
          </div>

          <!-- Table -->
          <div class="bg-surface rounded-lg shadow-card border border-line overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="text-left text-xs text-muted border-b border-line bg-canvas">
                    <th class="px-5 py-3 font-medium">Timestamp</th>
                    <th class="px-5 py-3 font-medium">Karyawan</th>
                    <th class="px-5 py-3 font-medium">Tensi</th>
                    <th class="px-5 py-3 font-medium">Suhu</th>
                    <th class="px-5 py-3 font-medium">SPO2</th>
                    <th class="px-5 py-3 font-medium">BMI</th>
                    <th class="px-5 py-3 font-medium">Sumber</th>
                    <th class="px-5 py-3 font-medium">Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="r in visible" :key="r.id" class="border-b border-line last:border-0 hover:bg-canvas">
                    <td class="px-5 py-3 text-muted whitespace-nowrap">{{ fmtTime(r.timestamp) }}</td>
                    <td class="px-5 py-3">
                      <span class="font-medium text-ink">{{ r.employeeName }}</span>
                      <span class="block text-xs text-muted">{{ r.employeeId }}</span>
                      <span v-if="r.reason" class="block text-xs text-danger mt-0.5">Alasan: {{ r.reason }}</span>
                    </td>
                    <td class="px-5 py-3" :class="(r.systolic > 140 || r.diastolic > 90) ? 'text-danger font-semibold' : 'text-ink'">
                      {{ r.systolic }}/{{ r.diastolic }}
                    </td>
                    <td class="px-5 py-3" :class="r.temperature >= 37.5 ? 'text-danger font-semibold' : 'text-ink'">{{ r.temperature }}°C</td>
                    <td class="px-5 py-3 text-ink">{{ r.spo2 }}%</td>
                    <td class="px-5 py-3 text-ink">{{ r.bmi }}</td>
                    <td class="px-5 py-3">
                      <span
                        class="px-2.5 py-1 rounded-full text-xs font-medium"
                        :class="r.source === 'Manual' ? 'bg-danger/10 text-danger' : 'bg-iconbg text-primary'"
                      >{{ r.source }}</span>
                    </td>
                    <td class="px-5 py-3">
                      <span
                        class="px-3 py-1 rounded-full text-xs font-semibold"
                        :class="r.status === 'FIT' ? 'bg-success/10 text-success' : 'bg-danger/10 text-danger'"
                      >{{ r.status }}</span>
                    </td>
                  </tr>
                  <tr v-if="!visible.length">
                    <td colspan="8" class="px-5 py-10 text-center text-muted">Tidak ada data pada filter ini.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `,
    };

    /* ========== PENGATURAN ========== */
    const PengaturanPage = {
      setup() {
        const officers = ref(MOCK.dutyOfficers.slice());
        const selectedId = ref(sessionStorage.getItem('sf2w_duty') || '');
        const editName = ref('');
        const editRole = ref('');

        onMounted(async () => {
          const res = await apiPost('listDutyOfficers', {});
          if (res.ok && res.officers) {
            officers.value = res.officers;
            const overrides = {};
            res.officers.forEach((o) => {
              overrides[o.id] = { name: o.name, role: o.role };
            });
            sessionStorage.setItem('sf2w_duty_overrides', JSON.stringify(overrides));
            window.dispatchEvent(new CustomEvent('sf2w:duty-changed', { detail: { id: selectedId.value } }));
            syncEdit();
          }
        });

        const selected = computed(() => {
          const o = officers.value.find((x) => x.id === selectedId.value);
          return o ? Object.assign({}, o) : null;
        });

        function syncEdit() {
          const o = officers.value.find((x) => x.id === selectedId.value);
          editName.value = o ? o.name : '';
          editRole.value = o ? o.role : '';
        }
        syncEdit();

        function select(id) {
          selectedId.value = id;
          sessionStorage.setItem('sf2w_duty', id);
          syncEdit();
          const o = officers.value.find((x) => x.id === id);
          window.dispatchEvent(new CustomEvent('sf2w:duty-changed', { detail: { id: id } }));
          showToast(o ? 'Petugas jaga: ' + o.name : 'Petugas jaga dipilih.');
        }

        async function saveOfficer() {
          const o = officers.value.find((x) => x.id === selectedId.value);
          if (!o) return;
          const trimmedName = (editName.value || '').trim();
          
          const res = await apiPost('saveDutyOfficer', { id: o.id, name: trimmedName, role: editRole.value });
          if (res.ok && res.officer) {
            const i = officers.value.findIndex(x => x.id === o.id);
            if (i >= 0) officers.value.splice(i, 1, res.officer);
            
            let overrides = {};
            try { overrides = JSON.parse(sessionStorage.getItem('sf2w_duty_overrides') || '{}') || {}; } catch(e){}
            overrides[o.id] = { name: res.officer.name, role: res.officer.role };
            sessionStorage.setItem('sf2w_duty_overrides', JSON.stringify(overrides));
            
            window.dispatchEvent(new CustomEvent('sf2w:duty-changed', { detail: { id: o.id } }));
            syncEdit();
            showToast(trimmedName ? 'Data petugas diperbarui.' : 'Data dikembalikan ke asli.');
          } else {
            showToast(res.message || 'Gagal menyimpan perubahan.', 'error');
            syncEdit();
          }
        }

        function clearSelection() {
          selectedId.value = '';
          sessionStorage.removeItem('sf2w_duty');
          editName.value = '';
          editRole.value = '';
          window.dispatchEvent(new CustomEvent('sf2w:duty-changed', { detail: { id: '' } }));
          showToast('Pilihan petugas jaga dikosongkan.');
        }

        return { officers, selectedId, selected, editName, editRole, select, saveOfficer, clearSelection };
      },
      template: `
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-bold text-ink">Pengaturan</h2>
            <p class="text-sm text-muted">Pilih dokter atau perawat yang jaga untuk shift berjalan.</p>
          </div>

          <div class="bg-surface rounded-lg shadow-card border border-line p-5 max-w-2xl">
            <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
              <div>
                <p class="text-xs font-semibold text-muted uppercase tracking-wider">Dokter / Perawat Jaga</p>
                <p class="text-sm text-muted mt-1">Petugas yang dipilih bertanggung jawab atas pemeriksaan shift ini.</p>
              </div>
              <button
                v-if="selected"
                class="min-touch px-3 py-2 rounded-md border border-line text-sm font-medium text-danger hover:bg-canvas"
                @click="clearSelection"
              >
                Kosongkan
              </button>
            </div>

            <div class="space-y-2">
              <button
                v-for="o in officers"
                :key="o.id"
                class="w-full flex items-center gap-3 p-3 rounded-lg border text-left min-touch transition"
                :class="selectedId === o.id ? 'border-primary bg-iconbg' : 'border-line hover:bg-canvas'"
                @click="select(o.id)"
              >
                <span
                  class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold shrink-0"
                  :class="selectedId === o.id ? 'bg-primary text-white' : 'bg-canvas text-muted'"
                >{{ o.initials }}</span>
                <span class="min-w-0 flex-1">
                  <span class="block text-sm font-semibold text-ink truncate">{{ o.name }}</span>
                  <span class="block text-xs text-muted">{{ o.role }} · {{ o.id }}</span>
                </span>
                <svg
                  v-if="selectedId === o.id"
                  class="w-5 h-5 text-primary shrink-0"
                  fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                ><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
              </button>
            </div>

            <div v-if="selected" class="mt-4 rounded-md bg-canvas border border-line px-4 py-3 space-y-3">
              <div class="flex items-center gap-3">
                <span class="w-2 h-2 rounded-full bg-success shrink-0"></span>
                <p class="text-sm text-ink">
                  Sedang jaga: <span class="font-semibold">{{ selected.name }}</span>
                  <span class="text-muted">({{ selected.role }})</span>
                </p>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-medium text-muted mb-1" for="duty-name">Nama (bisa disunting)</label>
                  <input
                    id="duty-name"
                    v-model="editName"
                    @change="saveOfficer"
                    type="text"
                    placeholder="Kosongkan untuk nama asli"
                    class="w-full min-touch px-3 py-2.5 rounded-md border border-line bg-surface text-sm text-ink placeholder-muted focus:outline-none focus:border-primary"
                  />
                </div>
                <div>
                  <label class="block text-xs font-medium text-muted mb-1" for="duty-role">Jabatan</label>
                  <select
                    id="duty-role"
                    v-model="editRole"
                    @change="saveOfficer"
                    class="w-full min-touch px-3 py-2.5 rounded-md border border-line bg-surface text-sm text-ink focus:outline-none focus:border-primary"
                  >
                    <option value="Dokter">Dokter</option>
                    <option value="Perawat">Perawat</option>
                  </select>
                </div>
              </div>
              <p class="text-xs text-muted mt-1">Nama hasil sunting menggantikan tampilan daftar, kartu jaga, dan header. Kosongkan nama lalu pindah fokus untuk mengembalikan data asli dari server.</p>
            </div>

            <p class="text-xs text-muted mt-4">Tersimpan di database (Google Sheets). Pilihan jaga otomatis tersimpan selama sesi shift berjalan (sessionStorage).</p>
          </div>
        </div>
      `,
    };

    /* ========== MOUNT ========== */
    const app = createApp(App);
    app.component('ToastHost', ToastHost);
    app.component('LoginPage', LoginPage);
    app.component('AppShell', AppShell);
    app.component('DashboardPage', DashboardPage);
    app.component('PemeriksaanPage', PemeriksaanPage);
    app.component('MonitoringPage', MonitoringPage);
    app.component('PengaturanPage', PengaturanPage);

    window.addEventListener('sf2w:toast', (e) => showToast(e.detail.message, e.detail.type));
    if (!location.hash) location.hash = '#/login';

    app.mount('#app');
  </script>
</body>
</html>
